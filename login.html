<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="container">
      <a class="logo" href="index.html">Romain<span>.</span>SAUVAGET</a>
      <div class="nav-links"><a href="index.html">← Retour au portfolio</a></div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="card auth-card">
      <h2>Connexion</h2>
      <p class="muted">Espace réservé à l'administrateur et aux examinateurs pour consulter la documentation des projets.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div id="msg"></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:8px">Se connecter</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const redirect = new URLSearchParams(location.search).get("redirect");

    // N'accepte que des redirections internes (évite les redirections ouvertes)
    const safeRedirect = redirect && /^[\w-]+\.html(\?[\w=&%-]*)?$/.test(redirect) ? redirect : null;

    if (!CONFIG_OK) initNav();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      btn.disabled = true;
      msg.innerHTML = "";

      const { error } = await sb.auth.signInWithPassword({
        email: form.email.value.trim(),
        password: form.password.value,
      });

      if (error) {
        msg.innerHTML = '<p class="alert">Identifiants incorrects.</p>';
        btn.disabled = false;
        return;
      }
      const user = await currentUser();
      location.href = safeRedirect || (user.role === "admin" ? "admin.html" : "index.html#projets");
    });
  </script>
</body>
</html>
